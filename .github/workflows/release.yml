name: Release Desktop App

on:
  push:
    tags:
      - '*.*'
      - '*.*.*'
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing Git tag to build and publish, for example 0.1 or v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish Tauri bundles
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag_name || github.ref_name }}
          releaseName: ${{ inputs.tag_name || github.ref_name }}
          releaseBody: |
            Automated release for ${{ inputs.tag_name || github.ref_name }}.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
